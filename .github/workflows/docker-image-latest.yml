name: Publish latest Docker image

on:
  push:
    branches:
      - stable
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true #needed for build/php submodule

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: name
        run: echo NAME=$(echo "${GITHUB_REPOSITORY,,}") >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@v7.3.0
        with:
          push: true
          file: ./docker/Dockerfile
          tags: |
            ghcr.io/${{ steps.name.outputs.NAME }}:latest
            ghcr.io/${{ steps.name.outputs.NAME }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/pocketmine-mp-ng:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pocketmine-mp-ng:${{ github.sha }}
          build-args: |
            GIT_HASH=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max